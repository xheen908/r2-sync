version: "3.8"

services:
  # Next.js Drive Web App Container
  r2sync-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r2sync-web
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - R2_ACCOUNT_ID=10c9109e9e342e2b4fc55e71ddf91c17
      - R2_ACCESS_KEY_ID=763791a177749b6538807006271e358f
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-bddfd02961a71996e0e6e078a0360a28082c52799fcc72e2a91615db58469b2a}
      - R2_BUCKET_NAME=easyfisk-docs
      - R2_PUBLIC_DOMAIN_URL=https://drive.ocpp-labs.com
    volumes:
      - ./data:/app/data

  # Cloudflare Tunnel Container (No open VPS ports required!)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - r2sync-web
